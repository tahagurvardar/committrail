services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: committrail
      POSTGRES_PASSWORD: committrail
      POSTGRES_DB: committrail
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U committrail -d committrail"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - committrail-postgres:/var/lib/postgresql/data

volumes:
  committrail-postgres:
