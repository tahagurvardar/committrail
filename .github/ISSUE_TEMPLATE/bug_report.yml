name: Bug report
description: Report a reproducible CommitTrail problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Remove secrets, private repository details, and personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CommitTrail version
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: data_check
    attributes:
      label: Sensitive-data check
      options:
        - I removed secrets and private or personal data
    validations:
      required: true
