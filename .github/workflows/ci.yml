name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://committrail:committrail@localhost:5432/committrail_ci
  TEST_DATABASE_URL: postgresql://committrail:committrail@localhost:5432/committrail_test
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-bytes
  APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  GITHUB_WEBHOOK_SECRET: ci-only-deterministic-webhook-secret-32-bytes

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: committrail
          POSTGRES_PASSWORD: committrail
          POSTGRES_DB: committrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U committrail -d committrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Node.js 22 and npm 10
        run: |
          node --version
          npm --version
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
          node -e "const {execFileSync}=require('node:child_process'); if (!execFileSync('npm',['--version'],{encoding:'utf8'}).trim().startsWith('10.')) process.exit(1)"

      - name: Runtime dependency audit
        run: npm audit --omit=dev

      - name: Generate and validate Prisma client
        run: |
          npm run db:generate
          npm run db:validate

      - name: Apply migrations to disposable test database
        run: npm run db:test:prepare

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:unit

      - name: PostgreSQL integration and worker/queue tests
        run: npm run test:integration

      - name: Production build
        run: npm run build
