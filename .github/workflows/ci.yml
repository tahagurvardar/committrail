name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://committrail:committrail@localhost:5432/committrail_ci
  TEST_DATABASE_URL: postgresql://committrail:committrail@localhost:5432/committrail_test
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-at-least-32-bytes
  APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  GITHUB_WEBHOOK_SECRET: ci-only-deterministic-webhook-secret-32-bytes
  PUBLIC_APP_URL: https://committrail.example.test

jobs:
  quality:
    name: Quality, PostgreSQL, build, and release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: committrail
          POSTGRES_PASSWORD: committrail
          POSTGRES_DB: committrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U committrail -d committrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Node.js 22 and npm 10
        run: |
          node --version
          npm --version
          node -e "if (process.versions.node.split('.')[0] !== '22') process.exit(1)"
          node -e "const {execFileSync}=require('node:child_process'); if (!execFileSync('npm',['--version'],{encoding:'utf8'}).trim().startsWith('10.')) process.exit(1)"

      - name: Runtime dependency audit
        run: npm audit --omit=dev

      - name: Full dependency audit visibility
        run: npm audit --audit-level=critical

      - name: Generate and validate Prisma client
        run: |
          npm run db:generate
          npm run db:validate

      - name: Apply migrations to disposable test database
        run: npm run db:test:prepare

      - name: Verify migration chain and custom guards
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run db:verify

      - name: Verify release configuration modes
        run: |
          npm run config:check -- local-full
          APP_MODE=public-demo npm run config:check -- public-demo

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:unit

      - name: PostgreSQL integration and worker/queue tests
        run: npm run test:integration

      - name: Verify database invariants
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run maintenance -- verify-invariants

      - name: Production build
        run: npm run build

      - name: Release integrity
        run: npm run release:check

  browser:
    name: Chromium E2E, accessibility, and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: committrail
          POSTGRES_PASSWORD: committrail
          POSTGRES_DB: committrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U committrail -d committrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install locked Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser release matrix
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          E2E_FIXTURES: "1"
        run: npm run test:e2e

      - name: Upload privacy-safe deterministic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-screenshots
          path: docs/assets/screenshots/*.png
          if-no-files-found: warn
          retention-days: 3
